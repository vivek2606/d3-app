name: Deploy to Hugging Face Space

# Pushes the app to a Hugging Face Docker Space on every push to main.
# Setup (once): repository Settings -> Secrets and variables -> Actions:
#   secret   HF_TOKEN  = a Hugging Face access token with write access
#   variable HF_SPACE  = <hf-username>/<space-name>, e.g. vivek2606/taalloop
# Until HF_SPACE is set the job is skipped, so pushes to main stay green.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN secret is not set"; exit 1; fi

          # Spaces read their settings from YAML front matter in README.md.
          {
            printf -- '---\n'
            printf 'title: TaalLoop\nemoji: 🥁\ncolorFrom: yellow\ncolorTo: red\n'
            printf 'sdk: docker\napp_port: 7860\npinned: false\n'
            printf 'short_description: Percussion loops, todas and rolls from any song\n'
            printf -- '---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md

          # Deploy a single fresh commit (the Space doesn't need tests or CI files).
          rm -rf .git .github tests
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
